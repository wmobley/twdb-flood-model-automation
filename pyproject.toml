[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twdb-flood-model-automation"
version = "0.1.0"
description = "Scaffold for TWDB flood-model automation, load balancing, and notebook workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
rubric = [
    "openpyxl>=3.1",
    "paramiko>=3.4",
    "pypsrp>=0.8",
    "nbformat>=5.9",
]
rubric-geo = [
    "geopandas>=1.0",
    "h5py>=3.10",
    "matplotlib>=3.8",
]

[tool.setuptools]
packages = ["load_balancer", "rubric_review"]

[tool.setuptools.package-data]
rubric_review = ["powershell/*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
